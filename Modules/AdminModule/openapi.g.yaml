openapi: 3.0.1
paths:
  /AdminModule/isAdmin:
    get:
      summary: Check if currently logged in tenantUser is an admin
      operationId: AdminModuleIsAdmin
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUserStatus'
  /AdminModule/tenantUser:
    post:
      summary: Add a new tenantUser
      operationId: AdminModuleAddTenantUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        405:
          description: Invalid input
      x-lz-gencall: TenantUserRepo.CreateAsync(callerInfo, body)
    put:
      summary: Update an existing tenantUser
      operationId: AdminModuleUpdateTenantUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
        405:
          description: Validation exception
      x-lz-gencall: TenantUserRepo.UpdateAsync(callerInfo, body)
  /AdminModule/tenantUser/listTenantUsers:
    get:
      summary: List all tenantUsers
      operationId: AdminModuleListTenantUsers
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid status value
      x-lz-gencall: TenantUserRepo.ListAsync(callerInfo)
  /AdminModule/subtenant:
    post:
      summary: Add a new Subtenant
      operationId: AdminModuleAddSubtenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        405:
          description: Invalid input
    put:
      summary: Update an existing Subtenant
      operationId: AdminModuleUpdateSubtenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
        405:
          description: Validation exception
  /AdminModule/subtenant/listSubtenants:
    get:
      summary: List all Subtenants
      operationId: AdminModuleListSubtenants
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid status value
  /AdminModule/subtenant/seedPets/{store}/{numPets}:
    get:
      summary: See pet database
      operationId: AdminModuleSeedPets
      parameters:
      - name: store
        in: path
        required: true
        description: Store to seed
        schema:
          type: string
      - name: numPets
        in: path
        required: true
        description: Number of pets to seed
        schema:
          type: integer
        default: 10
      responses:
        200:
          description: Success
  /AdminModule/suspendTenantUser/{tenantUser}:
    get:
      summary: Suspend TenantUser
      operationId: AdminModuleSuspendTenantUser
      parameters:
      - name: tenantUser
        in: path
        required: true
        description: tenantUser login
        schema:
          type: string
      responses:
        200:
          description: Success
  /AdminModule/tenantUser/{tenantUserId}:
    get:
      summary: Find tenantUser by ID
      operationId: AdminModuleGetTenantUserById
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.ReadAsync(callerInfo, tenantUserId)
  /AdminModule/tenantUser/delete/{tenantUserId}:
    delete:
      summary: Delete tenantUser by ID
      operationId: AdminModuleDeleteTenantUser
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.DeleteAsync(callerInfo, tenantUserId)
  /AdminModule/subtenant/{subtenantId}:
    get:
      summary: Find Subtenant by ID
      operationId: AdminModuleGetSubtenantById
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
  /AdminModule/subtenant/delete/{subtenantId}:
    delete:
      summary: Delete Subtenant by ID
      operationId: AdminModuleDeleteSubtenant
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
components:
  schemas:
    Preferences:
      type: object
      properties:
        id:
          type: string
        theme:
          type: string
          enum:
          - light
          - dark
        locale:
          type: string
          enum:
          - en
          - fr
          - es
        petStatus:
          description: pet status in the store
          $ref: '#/components/schemas/PetStatus'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        pet:
          $ref: '#/components/schemas/Pet'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Pet:
      type: object
      required:
      - name
      - photoUrls
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
          example: Dog
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        petStatus:
          description: pet status in the store
          default: available
          $ref: '#/components/schemas/PetStatus'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    PetStatus:
      type: string
      description: pet status in the store
      enum:
      - available
      - pending
      - sold
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          description: Cognito Identity Id of clerk entering order
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        orderStatus:
          title: orderStatus
          description: Order Status
          $ref: '#/components/schemas/OrderStatus'
        complete:
          type: boolean
          default: false
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    OrderStatus:
      type: string
      description: Order Status
      enum:
      - placed
      - approved
      - delivered
    Subtenant:
      type: object
      x-csharp-type: TenancyConfig
    TenantUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        employee:
          type: boolean
        admin:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    TenantUserStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      x-lz-genrepo: true
    Bada:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Fingerprint:
      type: object
      properties:
        id:
          type: string
        fingerprint:
          type: number
        browser:
          type: string
        browserVersion:
          type: string
        os:
          type: string
        osVersion:
          type: string
        resolution:
          type: string
        userAgent:
          type: string
        device:
          type: string
        deviceType:
          type: string
        deviceVendor:
          type: string
        language:
          type: string
        timeZone:
          type: string
        screenPrint:
          type: string
        isMobile:
          type: boolean
        isChrome:
          type: boolean
        isFirefox:
          type: boolean
        isSafari:
          type: boolean
        isIE:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
