openapi: 3.0.1
paths:
  /AdminModule/isAdmin:
    get:
      summary: Check if currently logged in tenantUser is an admin
      operationId: AdminModuleIsAdminAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUserStatus'
  /AdminModule/tenantUser:
    post:
      summary: Add a new tenantUser
      operationId: AdminModuleAddTenantUserAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        405:
          description: Invalid input
      x-lz-gencall: TenantUserRepo.CreateAsync(callerInfo, body)
    put:
      summary: Update an existing tenantUser
      operationId: AdminModuleUpdateTenantUserAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
        405:
          description: Validation exception
      x-lz-gencall: TenantUserRepo.UpdateAsync(callerInfo, body)
  /AdminModule/tenantUser/listTenantUsers:
    get:
      summary: List all tenantUsers
      operationId: AdminModuleListTenantUsersAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid status value
      x-lz-gencall: TenantUserRepo.ListAsync(callerInfo)
  /AdminModule/subtenant:
    post:
      summary: Add a new Subtenant
      operationId: AdminModuleAddSubtenantAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        405:
          description: Invalid input
    put:
      summary: Update an existing Subtenant
      operationId: AdminModuleUpdateSubtenantAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
        405:
          description: Validation exception
  /AdminModule/subtenant/listSubtenants:
    get:
      summary: List all Subtenants
      operationId: AdminModuleListSubtenantsAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid status value
  /AdminModule/subtenant/seedPets/{store}/{numPets}:
    get:
      summary: See pet database
      operationId: AdminModuleSeedPetsAsync
      parameters:
      - name: store
        in: path
        required: true
        description: Store to seed
        schema:
          type: string
      - name: numPets
        in: path
        required: true
        description: Number of pets to seed
        schema:
          type: integer
        default: 10
      responses:
        200:
          description: Success
  /AdminModule/suspendTenantUser/{tenantUser}:
    get:
      summary: Suspend TenantUser
      operationId: AdminModuleSuspendTenantUserAsync
      parameters:
      - name: tenantUser
        in: path
        required: true
        description: tenantUser login
        schema:
          type: string
      responses:
        200:
          description: Success
  /AdminModule/tenantUser/{tenantUserId}:
    get:
      summary: Find tenantUser by ID
      operationId: AdminModuleGetTenantUserByIdAsync
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.ReadAsync(callerInfo, tenantUserId)
  /AdminModule/tenantUser/delete/{tenantUserId}:
    delete:
      summary: Delete tenantUser by ID
      operationId: AdminModuleDeleteTenantUserAsync
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.DeleteAsync(callerInfo, tenantUserId)
  /AdminModule/subtenant/{subtenantId}:
    get:
      summary: Find Subtenant by ID
      operationId: AdminModuleGetSubtenantByIdAsync
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
  /AdminModule/subtenant/delete/{subtenantId}:
    delete:
      summary: Delete Subtenant by ID
      operationId: AdminModuleDeleteSubtenantAsync
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
components:
  schemas:
    Preferences:
      type: object
      properties:
        id:
          type: string
        theme:
          type: string
          enum:
          - light
          - dark
        locale:
          type: string
          enum:
          - en
          - fr
          - es
        petStatus:
          description: pet status in the store
          $ref: '#/components/schemas/PetStatus'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        pet:
          $ref: '#/components/schemas/Pet'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Pet:
      type: object
      required:
      - name
      - photoUrls
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
          example: Dog
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        petStatus:
          description: pet status in the store
          default: available
          $ref: '#/components/schemas/PetStatus'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    PetStatus:
      type: string
      description: pet status in the store
      enum:
      - available
      - pending
      - sold
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          description: Cognito Identity Id of clerk entering order
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        orderStatus:
          title: orderStatus
          description: Order Status
          $ref: '#/components/schemas/OrderStatus'
        complete:
          type: boolean
          default: false
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    OrderStatus:
      type: string
      description: Order Status
      enum:
      - placed
      - approved
      - delivered
    Subtenant:
      type: object
      x-csharp-type: TenancyConfig
    TenantUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        employee:
          type: boolean
        admin:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    TenantUserStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      x-lz-genrepo: true
    Bada:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Fingerprint:
      type: object
      properties:
        id:
          type: string
        fingerprint:
          type: number
        browser:
          type: string
        browserVersion:
          type: string
        os:
          type: string
        osVersion:
          type: string
        resolution:
          type: string
        userAgent:
          type: string
        device:
          type: string
        deviceType:
          type: string
        deviceVendor:
          type: string
        language:
          type: string
        timeZone:
          type: string
        screenPrint:
          type: string
        isMobile:
          type: boolean
        isChrome:
          type: boolean
        isFirefox:
          type: boolean
        isSafari:
          type: boolean
        isIE:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    ChatSession:
      type: object
      required:
      - sessionId
      - status
      - createdAt
      properties:
        sessionId:
          type: string
          description: Unique identifier for the chat session
        userId:
          type: string
          description: User ID from Cognito authentication
        status:
          $ref: '#/components/schemas/ChatSessionStatus'
        createdAt:
          type: string
          description: When the session was created
          format: date-time
        lastActivityAt:
          type: string
          description: Last activity timestamp
          format: date-time
        metadata:
          type: object
          description: Additional session metadata
      x-lz-genrepo: true
    ChatSessionStatus:
      type: string
      description: Current status of the chat session
      enum:
      - active
      - processing
      - completed
      - error
      - closed
    ChatMessage:
      type: object
      required:
      - messageId
      - sessionId
      - role
      - content
      - timestamp
      properties:
        messageId:
          type: string
          description: Unique identifier for the message
        sessionId:
          type: string
          description: Session this message belongs to
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: Message content
        timestamp:
          type: string
          description: When the message was created
          format: date-time
        metadata:
          type: object
          description: Additional message metadata
      x-lz-genrepo: true
    ChatMessageRole:
      type: string
      description: Role of the message sender
      enum:
      - user
      - assistant
      - system
    CreateSessionRequest:
      type: object
      required:
      - initialMessage
      properties:
        initialMessage:
          type: string
          description: Initial message to start the conversation
        sessionMetadata:
          type: object
          description: Optional metadata for the session
    CreateSessionResponse:
      type: object
      required:
      - session
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
    SendMessageRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          description: Message content to send
        messageMetadata:
          type: object
          description: Optional metadata for the message
    SendMessageResponse:
      type: object
      required:
      - message
      - session
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        session:
          $ref: '#/components/schemas/ChatSession'
    GetSessionStatusResponse:
      type: object
      required:
      - session
      - messageCount
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        messageCount:
          type: integer
          description: Total number of messages in the session
        lastMessage:
          $ref: '#/components/schemas/ChatMessage'
    SessionEvent:
      type: object
      required:
      - eventType
      - sessionId
      - timestamp
      properties:
        eventType:
          $ref: '#/components/schemas/SessionEventType'
        sessionId:
          type: string
          description: Session this event relates to
        timestamp:
          type: string
          description: When the event occurred
          format: date-time
        data:
          type: object
          description: Event-specific data
    SessionEventType:
      type: string
      description: Type of session event
      enum:
      - session_created
      - session_status_changed
      - message_received
      - message_processing
      - message_completed
      - session_closed
      - error_occurred
    MessageEvent:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
      allOf:
      - $ref: '#/components/schemas/SessionEvent'
    StatusChangeEvent:
      type: object
      properties:
        oldStatus:
          $ref: '#/components/schemas/ChatSessionStatus'
        newStatus:
          $ref: '#/components/schemas/ChatSessionStatus'
      allOf:
      - $ref: '#/components/schemas/SessionEvent'
    ErrorEvent:
      type: object
      properties:
        error:
          type: string
          description: Error message
        errorCode:
          type: string
          description: Error code for client handling
      allOf:
      - $ref: '#/components/schemas/SessionEvent'
    ChatError:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message
        sessionId:
          type: string
          description: Session ID if error is session-related
        timestamp:
          type: string
          description: When the error occurred
          format: date-time
    HealthCheckResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          description: Service version
    HealthStatus:
      type: string
      enum:
      - healthy
      - unhealthy
    UnhealthyResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        error:
          type: string
          description: Error description
    SessionMessagesResponse:
      type: object
      required:
      - messages
      - pagination
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    PaginationInfo:
      type: object
      required:
      - page
      - limit
      - totalMessages
      - hasMore
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalMessages:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
