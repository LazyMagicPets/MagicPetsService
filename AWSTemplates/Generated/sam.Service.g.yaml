Description: | 
  This stack defines the service resources

Parameters:
  ArtifactsBucketParameter:
    Description: "Bucket where artifacts are stored"
    Type: String

  EnvironmentParameter:   
    Type: String
    Description: The stage name for the API Gateway and controls some policies
  
  SystemSuffixParameter:
    Description: "System Guid. No spaces. Lower case."
    Type: String

  SystemKeyParameter:
    Description: "System Name. No spaces. Lower case."
    Type: String    

#LzParameters start
  tenantauthUserPoolIdParameter:
    Type: String
  tenantauthUserPoolClientIdParameter:
    Type: String
  tenantauthIdentityPoolIdParameter:
    Type: String
  tenantauthSecurityLevelParameter:
    Type: String
  tenantauthUserPoolArnParameter:
    Type: String
  consumerauthUserPoolIdParameter:
    Type: String
  consumerauthUserPoolClientIdParameter:
    Type: String
  consumerauthIdentityPoolIdParameter:
    Type: String
  consumerauthSecurityLevelParameter:
    Type: String
  consumerauthUserPoolArnParameter:
    Type: String
#LzParameters end


Resources:

#LzLambdas start
  AdminLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-AdminLambda"
      RetentionInDays: 1

  AdminLambda:
    # Generated by AwsApiLambdaResource from AWSTemplates/Snippets/sam.service.apilambda.yaml
    Type: AWS::Serverless::Function
    DependsOn: AdminLambdaLogGroup
    Properties:
      PackageType: Zip
      CodeUri: ../../Containers/AdminLambda/bin/Release/net8.0
               # container::namespace.class::method
      Handler: AdminLambda::LambdaFunc.LambdaEntryPoint::FunctionHandlerAsync
      Runtime: dotnet8
      Description: LazyMagic Generated Lambda
      MemorySize: 256
      Timeout: 30
      Tracing: Active
      Role: !GetAtt AdminLambdaExecutionRole.Arn

  AdminLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-AdminLambdaExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
      - arn:aws:iam::aws:policy/CloudFrontFullAccess
      - arn:aws:iam::aws:policy/AmazonS3FullAccess
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess

  AdminLambdaAdminApiPermissions:
    # Generated by AwsServiceApiLambdasResources from AWSTemplates/Snippets/sam.service.lambda.permission.yaml
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      FunctionName: !Ref AdminLambda
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*'

#LzLambdas end


#LzQueues start
#LzQeuues end


#LzApis start
  AdminApi:
