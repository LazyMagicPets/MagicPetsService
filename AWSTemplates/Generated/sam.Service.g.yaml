AWSTemplateFormatVersion: '2010-09-09'
# Generated by AwsServiceStackTemplate from AWSTemplates/Snippets/sam.service.yaml
Transform: 
  - 'AWS::Serverless-2016-10-31'
  - 'AWS::LanguageExtensions'
Description: | 
  This stack defines the service resources

Parameters:
  ArtifactsBucketParameter:
    Description: "Bucket where artifacts are stored"
    Type: String

  EnvironmentParameter:   
    Type: String
    Description: The stage name for API Gateways and used in some policies
  
  SystemSuffixParameter:
    Description: "System Guid. No spaces. Lower case."
    Type: String

  SystemKeyParameter:
    Description: "System Name. No spaces. Lower case."
    Type: String    

#LzParameters start

  tenantauthUserPoolIdParameter:
    Type: String

  tenantauthUserPoolClientIdParameter:
    Type: String

  tenantauthIdentityPoolIdParameter:
    Type: String

  tenantauthSecurityLevelParameter:
    Type: String

  tenantauthUserPoolArnParameter:
    Type: String

  consumerauthUserPoolIdParameter:
    Type: String

  consumerauthUserPoolClientIdParameter:
    Type: String

  consumerauthIdentityPoolIdParameter:
    Type: String

  consumerauthSecurityLevelParameter:
    Type: String

  consumerauthUserPoolArnParameter:
    Type: String
#LzParameters end


Resources:

#LzAppRunners start
  AppHostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/${AWS::StackName}-AppHost"
      RetentionInDays: 1

  AppHost:
    # Generated by AwsAppRunnerResource from __TemplateSource__
    Type: AWS::AppRunner::Service
    DependsOn: AppHostLogGroup
    Properties:
      ServiceName: !Sub "${AWS::StackName}-AppHost"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppHostAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${SystemKeyParameter}-${SystemSuffixParameter}-${EnvironmentParameter}-apphost:latest"
          ImageConfiguration:
            Port: 8080
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: LZ_AUTH_TENANTAUTH_USERPOOLID
                Value: !Ref tenantauthUserPoolIdParameter
              - Name: LZ_AUTH_CONSUMERAUTH_USERPOOLID
                Value: !Ref consumerauthUserPoolIdParameter
              - Name: AWS__AppSync__tenantauthEventsApi__HttpDomain
                Value: !GetAtt tenantauthEventsApi.Dns.Http
              - Name: AWS__AppSync__tenantauthEventsApi__ApiKey
                Value: !GetAtt tenantauthEventsApiApiKey.ApiKey
              - Name: AWS__AppSync__tenantauthEventsApi__Region
                Value: !Ref AWS::Region
              - Name: AWS__AppSync__consumerauthEventsApi__HttpDomain
                Value: !GetAtt consumerauthEventsApi.Dns.Http
              - Name: AWS__AppSync__consumerauthEventsApi__ApiKey
                Value: !GetAtt consumerauthEventsApiApiKey.ApiKey
              - Name: AWS__AppSync__consumerauthEventsApi__Region
                Value: !Ref AWS::Region
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: 1024
        Memory: 2048
        InstanceRoleArn: !GetAtt AppHostInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref AppHostAutoScalingConfiguration
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT

  AppHostAutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-AppHost-AS"
      MaxConcurrency: 150  # This represents the max requests for this architecture
      MaxSize: 1
      MinSize: 1

  # ECR repository is created by Deploy-DockerAws command before stack deployment
  # This ensures the image exists before App Runner tries to pull it

  AppHostInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-AppHost-InstanceRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
      - arn:aws:iam::aws:policy/CloudFrontFullAccess
      - arn:aws:iam::aws:policy/AmazonS3FullAccess

  AppHostAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-AppHost-AccessRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
#LzAppRunners end


#LzApis start
  tenantauthEventsApi:
    # Generated by AwsAppSyncEventsResource from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-tenantauthEventsApi"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref tenantauthUserPoolIdParameter
        ConnectionAuthModes:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt tenantauthEventsApiLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: tenantauthEventsApi

  tenantauthEventsApiLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-tenantauthEventsApi-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  tenantauthEventsApiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-tenantauthEventsApi-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${tenantauthEventsApi}/*"

  tenantauthEventsApiApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt tenantauthEventsApi.ApiId
      Description: API Key for tenantauthEventsApi
      # AWS AppSync API Keys have a maximum expiration of 365 days
      # Unix timestamp calculated as: current time + 365 days (31536000 seconds)
      # You must manually update this stack annually to rotate the key
      Expires: 1767225600  # January 1, 2026 (update annually)

  tenantauthEventsApiChatChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt tenantauthEventsApi.ApiId
      Name: chat
  consumerauthEventsApi:
    # Generated by AwsAppSyncEventsResource from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-consumerauthEventsApi"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref consumerauthUserPoolIdParameter
        ConnectionAuthModes:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt consumerauthEventsApiLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: consumerauthEventsApi

  consumerauthEventsApiLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-consumerauthEventsApi-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  consumerauthEventsApiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-consumerauthEventsApi-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${consumerauthEventsApi}/*"

  consumerauthEventsApiApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt consumerauthEventsApi.ApiId
      Description: API Key for consumerauthEventsApi
      # AWS AppSync API Keys have a maximum expiration of 365 days
      # Unix timestamp calculated as: current time + 365 days (31536000 seconds)
      # You must manually update this stack annually to rotate the key
      Expires: 1767225600  # January 1, 2026 (update annually)

  consumerauthEventsApiChatChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt consumerauthEventsApi.ApiId
      Name: chat

#LzApis end


Outputs:

#LzOutputs start

  AppApi:
    Value: !GetAtt AppHost.ServiceUrl


  tenantauthEventsApiAuth:
    Value: tenantauth


  tenantauthEventsApiDomain:
    Value: !GetAtt tenantauthEventsApi.Dns.Http


  tenantauthEventsApiApiKey:
    Value: !GetAtt tenantauthEventsApiApiKey.ApiKey


  consumerauthEventsApiAuth:
    Value: consumerauth


  consumerauthEventsApiDomain:
    Value: !GetAtt consumerauthEventsApi.Dns.Http


  consumerauthEventsApiApiKey:
    Value: !GetAtt consumerauthEventsApiApiKey.ApiKey

#LzOutputs end


    