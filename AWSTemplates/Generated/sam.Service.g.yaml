  ChatApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/${AWS::StackName}-ChatApi"
      RetentionInDays: 1

  ChatApi:
    # Generated by AwsAppRunnerResource from __TemplateSource__
    Type: AWS::AppRunner::Service
    DependsOn: ChatApiLogGroup
    Properties:
      ServiceName: !Sub "${AWS::StackName}-ChatApi"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ChatApiAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${SystemKeyParameter}-${SystemSuffixParameter}-${EnvironmentParameter}-chatapprunner:latest"
          ImageConfiguration:
            Port: 8080
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS__Cognito__UserPoolId
                Value: !Ref tenantauthUserPoolIdParameter
              - Name: AWS__AppSync__EventApiId
                Value: !Ref EventsApi
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: 1024
        Memory: 2048
        InstanceRoleArn: !GetAtt ChatApiInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref ChatApiAutoScalingConfiguration
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT

  ChatApiAutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-ChatApi-AS"
      MaxConcurrency: 150  # This represents the max requests for this architecture
      MaxSize: 1
      MinSize: 1

  # ECR repository is created by Deploy-DockerAws command before stack deployment
  # This ensures the image exists before App Runner tries to pull it

  ChatApiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ChatApi-InstanceRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  ChatApiAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ChatApi-AccessRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
  EventsApi:
    # Generated by AwsAppSyncEventsResource from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-EventsApi"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM

          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref tenantauthUserPoolIdParameter
        ConnectionAuthModes:
          - AuthType: AWS_IAM

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultSubscribeAuthModes:
          - AuthType: AWS_IAM

          - AuthType: AMAZON_COGNITO_USER_POOLS
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt EventsApiLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: EventsApi

  EventsApiLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-EventsApi-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  EventsApiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-EventsApi-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${EventsApi}/*"
