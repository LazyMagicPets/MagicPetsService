      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt TenantApiAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${SystemKeyParameter}-${SystemSuffixParameter}-${EnvironmentParameter}-aspnetcontainer:latest"
          ImageConfiguration:
            Port: 8080
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS__Cognito__UserPoolId
                Value: !Ref tenantauthUserPoolIdParameter
