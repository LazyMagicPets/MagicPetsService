AWSTemplateFormatVersion: '2010-09-09'
# Generated by AwsServiceStackTemplate from AWSTemplates/Snippets/sam.service.yaml
Transform: 
  - 'AWS::Serverless-2016-10-31'
  - 'AWS::LanguageExtensions'
Description: | 
  This stack defines the service resources

Parameters:
  ArtifactsBucketParameter:
    Description: "Bucket where artifacts are stored"
    Type: String

  EnvironmentParameter:   
    Type: String
    Description: The stage name for API Gateways and used in some policies
  
  SystemSuffixParameter:
    Description: "System Guid. No spaces. Lower case."
    Type: String

  SystemKeyParameter:
    Description: "System Name. No spaces. Lower case."
    Type: String    

#LzParameters start

  tenantauthUserPoolIdParameter:
    Type: String

  tenantauthUserPoolClientIdParameter:
    Type: String

  tenantauthIdentityPoolIdParameter:
    Type: String

  tenantauthSecurityLevelParameter:
    Type: String

  tenantauthUserPoolArnParameter:
    Type: String

  consumerauthUserPoolIdParameter:
    Type: String

  consumerauthUserPoolClientIdParameter:
    Type: String

  consumerauthIdentityPoolIdParameter:
    Type: String

  consumerauthSecurityLevelParameter:
    Type: String

  consumerauthUserPoolArnParameter:
    Type: String
#LzParameters end


Resources:

#LzAppRunners start
  StoreHostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/${AWS::StackName}-StoreHost"
      RetentionInDays: 1

  StoreHost:
    # Generated by AwsAppRunnerResource from __TemplateSource__
    Type: AWS::AppRunner::Service
    DependsOn: StoreHostLogGroup
    Properties:
      ServiceName: !Sub "${AWS::StackName}-StoreHost"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt StoreHostAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${SystemKeyParameter}-${SystemSuffixParameter}-${EnvironmentParameter}-storehost:latest"
          ImageConfiguration:
            Port: 8080
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS__Cognito__UserPoolId
                Value: !Ref tenantauthUserPoolIdParameter
              - Name: AWS__AppSync__EventsApi__HttpDomain
                Value: !GetAtt StoreEventsApi.Dns.Http
              - Name: AWS__AppSync__EventsApi__ApiKey
                Value: !GetAtt StoreEventsApiApiKey.ApiKey
              - Name: AWS__AppSync__EventsApi__Region
                Value: !Ref AWS::Region
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: 1024
        Memory: 2048
        InstanceRoleArn: !GetAtt StoreHostInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref StoreHostAutoScalingConfiguration
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT

  StoreHostAutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-StoreHost-AS"
      MaxConcurrency: 150  # This represents the max requests for this architecture
      MaxSize: 1
      MinSize: 1

  # ECR repository is created by Deploy-DockerAws command before stack deployment
  # This ensures the image exists before App Runner tries to pull it

  StoreHostInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StoreHost-InstanceRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
      - arn:aws:iam::aws:policy/CloudFrontFullAccess
      - arn:aws:iam::aws:policy/AmazonS3FullAccess

  StoreHostAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StoreHost-AccessRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
  ConsumerHostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/${AWS::StackName}-ConsumerHost"
      RetentionInDays: 1

  ConsumerHost:
    # Generated by AwsAppRunnerResource from __TemplateSource__
    Type: AWS::AppRunner::Service
    DependsOn: ConsumerHostLogGroup
    Properties:
      ServiceName: !Sub "${AWS::StackName}-ConsumerHost"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ConsumerHostAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${SystemKeyParameter}-${SystemSuffixParameter}-${EnvironmentParameter}-consumerhost:latest"
          ImageConfiguration:
            Port: 8080
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS__Cognito__UserPoolId
                Value: !Ref consumerauthUserPoolIdParameter
              - Name: AWS__AppSync__EventsApi__HttpDomain
                Value: !GetAtt ConsumerEventsApi.Dns.Http
              - Name: AWS__AppSync__EventsApi__ApiKey
                Value: !GetAtt ConsumerEventsApiApiKey.ApiKey
              - Name: AWS__AppSync__EventsApi__Region
                Value: !Ref AWS::Region
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: 1024
        Memory: 2048
        InstanceRoleArn: !GetAtt ConsumerHostInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref ConsumerHostAutoScalingConfiguration
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT

  ConsumerHostAutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-ConsumerHost-AS"
      MaxConcurrency: 150  # This represents the max requests for this architecture
      MaxSize: 1
      MinSize: 1

  # ECR repository is created by Deploy-DockerAws command before stack deployment
  # This ensures the image exists before App Runner tries to pull it

  ConsumerHostInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ConsumerHost-InstanceRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  ConsumerHostAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ConsumerHost-AccessRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
#LzAppRunners end


#LzApis start
  StoreEventsApi:
    # Generated by AwsAppSyncEventsResource from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-StoreEventsApi"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref tenantauthUserPoolIdParameter
        ConnectionAuthModes:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt StoreEventsApiLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: StoreEventsApi

  StoreEventsApiLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StoreEventsApi-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  StoreEventsApiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StoreEventsApi-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${StoreEventsApi}/*"

  StoreEventsApiApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt StoreEventsApi.ApiId
      Description: API Key for StoreEventsApi
      # AWS AppSync API Keys have a maximum expiration of 365 days
      # Unix timestamp calculated as: current time + 365 days (31536000 seconds)
      # You must manually update this stack annually to rotate the key
      Expires: 1767225600  # January 1, 2026 (update annually)

  StoreEventsApiChatChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt StoreEventsApi.ApiId
      Name: chat
  ConsumerEventsApi:
    # Generated by AwsAppSyncEventsResource from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-ConsumerEventsApi"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref consumerauthUserPoolIdParameter
        ConnectionAuthModes:
          - AuthType: AWS_IAM
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

          - AuthType: AMAZON_COGNITO_USER_POOLS
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt ConsumerEventsApiLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: ConsumerEventsApi

  ConsumerEventsApiLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ConsumerEventsApi-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  ConsumerEventsApiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ConsumerEventsApi-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${ConsumerEventsApi}/*"

  ConsumerEventsApiApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt ConsumerEventsApi.ApiId
      Description: API Key for ConsumerEventsApi
      # AWS AppSync API Keys have a maximum expiration of 365 days
      # Unix timestamp calculated as: current time + 365 days (31536000 seconds)
      # You must manually update this stack annually to rotate the key
      Expires: 1767225600  # January 1, 2026 (update annually)

  ConsumerEventsApiChatChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt ConsumerEventsApi.ApiId
      Name: chat

#LzApis end


Outputs:

#LzOutputs start

  StoreApi:
    Value: !GetAtt StoreHost.ServiceUrl


  ConsumerApi:
    Value: !GetAtt ConsumerHost.ServiceUrl


  StoreEventsApiAuth:
    Value: tenantauth


  StoreEventsApiHttpDomain:
    Value: !GetAtt StoreEventsApi.Dns.Http


  StoreEventsApiApiKey:
    Value: !GetAtt StoreEventsApiApiKey.ApiKey


  ConsumerEventsApiAuth:
    Value: consumerauth


  ConsumerEventsApiHttpDomain:
    Value: !GetAtt ConsumerEventsApi.Dns.Http


  ConsumerEventsApiApiKey:
    Value: !GetAtt ConsumerEventsApiApiKey.ApiKey

#LzOutputs end


    