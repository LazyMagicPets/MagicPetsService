              - Name: AWS__AppSync__EventsApi__ApiKey
                Value: !GetAtt TenantEventsApiApiKey.ApiKey
              - Name: AWS__AppSync__EventsApi__Region
                Value: !Ref AWS::Region
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: 1024
        Memory: 2048
        InstanceRoleArn: !GetAtt TenantApiInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref TenantApiAutoScalingConfiguration
