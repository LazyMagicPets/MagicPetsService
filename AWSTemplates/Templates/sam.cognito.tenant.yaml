AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: | 
  This stack creates a consumer user pool and 
  user pool client. This user pool requires 
  admin to invite the user.

Parameters:

  SystemSuffixParameter:
    Description: "SystemSuffix"
    Type: String

  SystemKeyParameter:
    Type: String

  UserPoolNameParameter:
    Description: "UserPoolName"
    Type: String
    Default: "Tenant_UserPool"    

  CustomDomainParameter:
    Description: "Optional custom domain for Cognito (e.g., auth.example.com)"
    Type: String
    Default: ""

  DeleteAfterDaysParameter:
    Description: "DeleteAfterDays"
    Type: Number
    Default: 60 

  StartWindowMinutesParameter:
    Description: "StartWindowMinutes"
    Type: Number
    Default: 60 

  ScheduleExpressionParameter:
    Description: "ScheduleExpression"
    Type: String
    Default: "cron(0 5 ? * * *)" # Daily at 5 AM UTC

  SecurityLevelParameter:
    Description: "SecurityLevel"
    Type: Number
    Default: 1

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainParameter, ""]]

Resources:
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub ${SystemSuffixParameter}---${UserPoolNameParameter}CognitoBackupVault

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub ${SystemKeyParameter}---${UserPoolNameParameter}CognitoBackupPlan
        BackupPlanRule:
          - RuleName: DailyBackups
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref ScheduleExpressionParameter  
            StartWindowMinutes: !Ref StartWindowMinutesParameter
            Lifecycle:
              DeleteAfterDays: !Ref DeleteAfterDaysParameter

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AliasAttributes:
      - email
      - preferred_username
      UserPoolName: !Ref UserPoolNameParameter
      AutoVerifiedAttributes:
      - email
      Schema:
      - AttributeDataType: String
        Name: email
        Required: true
        Mutable: true
      
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${SystemSuffixParameter}-${UserPoolNameParameter}
      UserPoolId: !Ref UserPool
      
  UserPoolUICustomization:
    Type: AWS::Cognito::UserPoolUICustomizationAttachment
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      CSS: |
        /* MagicPets Managed Login UI Style */
        .banner-customizable {
          padding: 25px 0px 25px 0px;
          background-color: #232f3e;
        }
        .logo-customizable {
          max-width: 60%;
          max-height: 100%;
        }
        .textDescription-customizable {
          padding-top: 10px;
          padding-bottom: 10px;
          display: block;
          font-size: 16px;
        }
        .submitButton-customizable {
          font-size: 14px;
          font-weight: bold;
          margin: 20px 0px 10px 0px;
          height: 40px;
          width: 100%;
          color: #fff;
          background-color: #ffa500;
          border-radius: 4px;
          border: none;
        }
        .submitButton-customizable:hover {
          background-color: #ffb84d;
        }
        .inputField-customizable {
          height: 34px;
          color: #555;
          background-color: #fff;
          border: 1px solid #ccc;
          border-radius: 4px;
          padding: 6px 12px;
        }
        .inputField-customizable:focus {
          border-color: #ffa500;
          outline: 0;
          box-shadow: inset 0 1px 1px rgba(0,0,0,.075), 0 0 0 3px rgba(255,165,0,.1);
        }
        .background-customizable {
          background-color: #f5f5f5;
        }
        .errorMessage-customizable {
          padding: 5px 15px;
          font-size: 14px;
          border-radius: 4px;
          margin-bottom: 15px;
          background: #f2dede;
          border: 1px solid #ebccd1;
          color: #a94442;
        }
    DependsOn: UserPoolDomain
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
      - COGNITO
      GenerateSecret: false
      AllowedOAuthFlows:
      - code
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      RefreshTokenValidity: 30
      AllowedOAuthScopes:
      - phone
      - email
      - openid
      - aws.cognito.signin.user.admin
      - profile
      CallbackURLs:
      - awsloginmaui://auth-callback
      - https://localhost:7218/authentication/login-callback
      - https://uptown.lazymagicdev.click/baseapp/authentication/login-callback
      - https://downtown.lazymagicdev.click/baseapp/authentication/login-callback 
      - https://uptown.lazymagicdev.click/store/authentication/login-callback
      - https://downtown.lazymagicdev.click/store/authentication/login-callback 
      - https://uptown.lazymagicdev.click/admin/authentication/login-callback
      - https://downtown.lazymagicdev.click/admin/authentication/login-callback

      LogoutURLs:
      - https://localhost:7218/
      - https://uptown.lazymagicdev.click/baseapp/
      - https://downtown.lazymagicdev.click/baseapp/
      - https://uptown.lazymagicdev.click/store/
      - https://downtown.lazymagicdev.click/store/
      - https://uptown.lazymagicdev.click/admin/
      - https://downtown.lazymagicdev.click/admin/

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ClientId:
    Description: "The OAuth2/OIDC Client ID (same as UserPoolClientId)"
    Value: !Ref UserPoolClient
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  UserPoolDomain:
    Value: !Ref UserPoolDomain
  IssuerUrl:
    Description: "The JWT issuer URL (appears in the 'iss' claim of tokens)"
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  AuthorityDomain:
    Description: "The authority domain for OAuth2/OIDC authentication (custom domain if configured, otherwise same as IssuerUrl)"
    Value: !If 
      - HasCustomDomain
      - !Sub https://${CustomDomainParameter}
      - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  MetadataUrl:
    Description: "The OIDC metadata discovery URL"
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomainParameter}/.well-known/openid-configuration
      - !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration
  HostedUIDomain:
    Description: "The Cognito Hosted UI domain (where users log in)"
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  SecurityLevel:
    Value: !Ref SecurityLevelParameter  