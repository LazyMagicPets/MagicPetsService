AWSTemplateFormatVersion: '2010-09-09'

Description: | 
  This stack creates ubiqutious cloudfront policies, functions etc. for tenancies
Parameters:

  SystemKey:
    Description: "System Name"
    Type: String
  EnvironmentParameter:
    Description: "Environment"
    Type: String
    Default: "dev"
    AllowedValues:
      - dev
      - test
      - prod
  KeyValueStoreArnParameter:
    Description: "The CloudFront KeyValueStore ARN"
    Type: String    

Conditions:
  IsDev: !Equals [!Ref EnvironmentParameter, "dev"]

Resources:
  # The AuthConfig function is used to return the authentication informaiton 
  # necessary to connect to the system.
  AuthConfigFunction:  
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${SystemKey}---authconfig
      AutoPublish: true
      FunctionConfig:
        Comment: 'Handle authconfig Requests.'
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !Ref KeyValueStoreArnParameter
      FunctionCode: |
        // CloudFront Function Runtime: cloudfront-js-2.0
        // Limitations: No optional chaining (?.), no replaceAll(), no nullish coalescing (??), limited ES6+ features
        import cf from 'cloudfront';
        const kvs = cf.kvs();
        async function handler(event) {
            const request = event.request;
            const headers = request.headers;
            let uri = request.uri;
            const originalUri = request.uri;
            const origin = headers.origin && headers.origin.value;
            const debug = false;
            const log = true;
            if(debug) console.log("host: " + host);
            let config = {
                meta: {
                    type: "",
                    awsRegion: ""
                },
                authConfigs: {},
                eventsApis: {}
            };
            try {
                // Get AuthConfigs from KVS
                const authConfigs = await kvs.get("AuthConfigs");
                if (authConfigs) {
                    config.authConfigs = JSON.parse(authConfigs);
                }

                // Get EventsApis from KVS
                try {
                    const eventsApis = await kvs.get("EventsApis");
                    if (eventsApis) {
                        config.eventsApis = JSON.parse(eventsApis);
                    }
                } catch (eventsErr) {
                    // EventsApis might not exist yet, continue without it
                    console.log("EventsApis not found in KVS, continuing without it");
                }

                return {
                    statusCode: 200,
                    statusDescription: "Success",
                    headers: {
                        'content-type': { value: 'application/json' }, // Set the content type to application/json
                        'cache-control': { value: 'max-age=0, no-cache, no-store, must-revalidate' } // Set caching headers to prevent caching
                    },
                    body: JSON.stringify(config, null, 0)
                }

            } catch (err) {
                console.log("Error listing KVS entries:", err);
                return {
                    statusCode: 500,
                    statusDescription: 'Internal Server Error'
                };
            }
        }


  # The Request function is used to update S3 origins on the fly using
  # an associated CloudFront KeyValueStore. This function reads kvs
  # using the [subdomain.]domain as the key. The value returned
  # is a configuration object optimized for size because KVS
  # values must be under 1KB in size and we don't want more than
  # one kvs access per request.
  # Each kvs JSON entry has the following form:
  # {
  #     env: "",
  #     tenantKey: "",
  #     subtenantKey: "",
  #     systemKey: "",
  #     ss: "", // system sufix
  #     ts: "", // tenant sufix
  #     sts: "", // subtenant sufix
  #     region: "",
  # }
  # Each Behavior entry is an array of strings. See the AssetType switch
  # statement in the function for documentatio of each type of behavior entry.
  #
  RequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${SystemKey}---request
      AutoPublish: true
      FunctionConfig:
        Comment: 'Handle Asset Requests.'
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !Ref KeyValueStoreArnParameter
      FunctionCode: !Sub |
        // CloudFront Function Runtime: cloudfront-js-2.0
        // Limitations: No optional chaining (?.), no replaceAll(), no nullish coalescing (??), limited ES6+ features
        import cf from 'cloudfront';
        const kvs = cf.kvs();
        let debug = false;

        async function handler(event) {
            try {
                const request = event.request;
                const headers = request.headers;
                const origin = headers.origin && headers.origin.value;
                const origUri = request.uri;
                const origDom = headers.host.value;
                if(!request.uri) request.uri = '/';
                let logMessage = '';

                const err = (code, msg) => ({statusCode: code, statusDescription: code === 404 ? 'Not Found' : 'Error', body: msg});

                const ch = (headers.cookie && headers.cookie[0] && headers.cookie[0].value) || '';
                const stm = ch.match(/lz-subtenant=([^;]+)/);
                const anm = ch.match(/lz-authname=([^;]+)/);

                // Subdomain redirect to /auth
                const dp = origDom.split('.');
                if (dp.length > 2 && !stm && origUri !== '/auth' && !origUri.startsWith('/auth/')) {
                    const qs = request.querystring || {};
                    let loc = 'https://' + dp.slice(-2).join('.') + '/auth?subtenant=' + dp[0] + '&returnUrl=' + encodeURIComponent(origUri);
                    if (qs.authname && qs.authname.value) loc += '&authname=' + encodeURIComponent(qs.authname.value);
                    return {statusCode: 302, statusDescription: 'Found', headers: {'location': {value: loc}, 'cache-control': {value: 'no-store'}}};
                }

                let kKey = origDom;
                if (stm) {
                    const stc = stm[1];
                    const rd = origDom.split('.').slice(-2).join('.');
                    kKey = stc + '.' + rd;
                    if (debug) logMessage += '\nKVS: ' + kKey + ' (st: ' + stc + ')';
                }

                let config = await GetConfig(kKey);
                const cfgJson = JSON.stringify(config);
                if (config.env === 'dev' && request.method === 'OPTIONS' && origin && 
                    origin.startsWith('https://localhost:') && headers['access-control-request-method']) {
                    return {
                        statusCode: 204,
                        statusDescription: 'No Content',
                        headers: {
                            'access-control-allow-origin': {value: origin},
                            'access-control-allow-methods': {value: 'GET, HEAD, POST, PUT, DELETE, CONNECT, OPTIONS, TRACE, PATCH'},
                            'access-control-allow-headers': {value: 'Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token'},
                            'access-control-max-age': {value: '86400'},
                            'cache-control': {value: 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0'}
                        }
                    };
                }
                const sysKey = config.systemKey;
                const tenKey = config.tenantKey || '';
                const stKey = config.subtenantKey || '';
                let bhv = null;
                let redPath = null;
                if(config.behaviors) {
                    const bref = [];
                    config.behaviors.forEach((b, i) => {
                        const paths = b[0].split(',');
                        paths.forEach((prefix,p) => {
                            const redPath = (p !== 0 ? paths[0] : null);
                            bref.push([prefix, i, redPath]);
                        });
                    });
                    bref.sort((a, b) => b[0].length - a[0].length);
                    for(let i = 0; i < bref.length; i++) {
                        if (request.uri.startsWith(bref[i][0])) {
                            redPath = bref[i][2];
                            bhv = config.behaviors[bref[i][1]];
                            break;
                        }
                    }
                }
                if(!bhv) return err(404, 'No path match');
                const aType = bhv[1];
                const awsSfx = '.amazonaws.com';
                let oPath = "", aName = "", apPath = "";
                let rmPfx = false, addCH = false;

                switch(aType) {
                    case "api":
                        aName = bhv[2].replace(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//, '');
                        rmPfx = true;
                        oPath =  (aName.includes("execute-api")) ? "/" + config.env : "";
                        headers['lz-config'] = {value: cfgJson};
                        headers['lz-tenantid'] = {value: headers.host.value};

                        if (stm) {
                            headers['lz-subtenant'] = {value: stm[1]};
                            if (debug) logMessage += '\nst: ' + stm[1];
                        }
                        if (anm) {
                            headers['lz-authname'] = {value: anm[1]};
                            if (debug) logMessage += '\nan: ' + anm[1];
                        }

                        const authHdr = headers['authorization'] && headers['authorization'].value;
                        if(authHdr && authHdr.startsWith('AWS4-HMAC-SHA256 Credential=')) headers['lz-config-authorization'] = {value: authHdr};
                        headers['lz-aws-kvsarn'] = {value: "${KeyValueStoreArnParameter}"};
                        const apiS2 = request.uri.indexOf('/', 1);
                        request.uri = apiS2 > 0 ? request.uri.slice(apiS2) : '/';
                        break;
                    case "assets":
                        const bLvl = bhv[4];
                        const aTenKey = bLvl > 0 ? tenKey : '';
                        const aStKey = bLvl > 1 ? stKey : '';
                        aName = sysKey + '-' + aTenKey + '-' + aStKey + '-' + aType + '-' + bhv[2] + '.s3.' + bhv[3] + awsSfx;
                        rmPfx = true;
                        addCH = true;
                        const astS2 = request.uri.indexOf('/', 1);
                        request.uri = astS2 > 0 ? request.uri.slice(astS2) : '/';
                        break;
                    case "webapp":
                        const paths = bhv[0].split(',');
                        apPath = paths[0];
                        const wLvl = bhv[4];
                        const wTenKey = wLvl > 0 ? tenKey : '';
                        const wStKey = wLvl > 1 ? stKey : '';
                        aName = sysKey + '-' + wTenKey + '-' + wStKey + '-' + aType + '-' + bhv[2] + '-' + bhv[3] + '.s3.' + bhv[4] + awsSfx;
                        rmPfx = false;
                        addCH = true;
                        oPath = "/wwwroot";
                        if (!(/\.[a-zA-Z0-9]+$/.test(request.uri))) request.uri = apPath + 'index.html';
                        break;
                }
                aName = aName
                    .replace(/{sts}/g, config.sts)
                    .replace(/{ts}/g, config.ts)
                    .replace(/{ss}/g, config.ss);

                if (aName.includes('{')) return err(404, 'Bad Config behavior entry');

                const cKV = aName + '-' + oPath + '-' +  request.uri;
                if(addCH) headers['x-custom-cache-key'] = {value: cKV};
                if(request.uri === '/') headers['referrer'] = {value: origDom + '/sets'};

                cf.updateRequestOrigin({
                    "domainName": aName,
                    "originPath": oPath
                });

                if(debug) console.log(logMessage += "\n origDom: " +  origDom + "\n origUri: " + origUri + "\n apPath: " + apPath + "\n redPath:" + redPath + "\n aName: " + aName + "\n oPath:" + oPath + "\n cachekey: " + cKV + "\n request.uri: " + request.uri);

                return request;
            } catch (e) {
                console.log('Unhandled error: ' + (e.message || e));
                return {statusCode: 500, statusDescription: 'Error', body: 'Internal Server Error'};
            }

            async function GetConfig(host) {
                console.log("GetConfig:" + host );
                try {
                    let behaviors = [];
                    let cfg = null;
                    let key = host;
                    while (key) {
                        const json = await kvs.get(key);
                        if (!json || json === '') {
                            if (!cfg) throw Error("Missing Config");
                            break;
                        }
                        const c = JSON.parse(json);
                        if (!cfg) cfg = c;
                        if (c.behaviors) behaviors = behaviors.concat(c.behaviors);
                        key = c.more || null;
                    }
                    if (!cfg || (!behaviors.length && !cfg.redirecthost)) throw Error("Bad Config");
                    cfg.behaviors = behaviors;
                    return cfg;
                } catch (e) {
                    console.log(e.message);
                    throw e;
                }
            }
        }


  CloudFrontFunctionLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${SystemKey}-CloudFrontFunctionLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/cloudfront/function/*

  CacheByHeaderDevPolicy:
    Type: 'AWS::CloudFront::CachePolicy'
    Properties:
      CachePolicyConfig:
        Name: !Sub ${SystemKey}-CacheByHeaderDevPolicy
        Comment: 'Cache policy using custom x-custom-cache-key header'
        DefaultTTL: 1  # use minimum TTL in development
        MaxTTL: 31536000   # 1 year in seconds
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: whitelist
            Cookies:
              - lz-subtenant
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - 'x-custom-cache-key'
          QueryStringsConfig:
            QueryStringBehavior: none

  CacheByHeaderProdPolicy:
    Type: 'AWS::CloudFront::CachePolicy'
    Properties:
      CachePolicyConfig:
        Name: !Sub ${SystemKey}-CacheByHeaderProdPolicy
        Comment: 'Cache policy using custom x-custom-cache-key header'
        DefaultTTL: 86400  # 1 day in seconds
        MaxTTL: 31536000   # 1 year in seconds
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: whitelist
            Cookies:
              - lz-subtenant
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: 
              - 'x-custom-cache-key'
          QueryStringsConfig:
            QueryStringBehavior: none

  CachingOptimizedDevPolicy:
    Type: 'AWS::CloudFront::CachePolicy'
    Properties:
      CachePolicyConfig:
        Name: !Sub ${SystemKey}-CachingOptimizedDev
        Comment: 'Managed policy for optimized caching for dev environment'
        DefaultTTL: 1  # allows rapid update for development testing
        MaxTTL: 31536000   # 1 year in seconds
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none


# CloudFront Policies 
# There are three types of CloudFront policies:
# - CachePolicy: Determines the cache key and the TTLs for the cacheable content.
# - OriginRequestPolicy: Determines the headers, query strings, and cookies that are included in requests that CloudFront sends to the origin.
#       Note that any headers included in the CachePolicy are also passed through to the origin.  
# - ResponseHeadersPolicy: Determines the headers that CloudFront includes in the response that it returns to the viewer.
#       Note: The ResponseHeadersPolicy may contain distribution specific content in the CSP, so it is defined in the sam.cloudfront.yaml template.
# AWS Provides some managed policies that can be used in lieu of creating custom policies. The IDs for these policies don't change and 
# are provided below.
#
# Type: AWS::CloudFront::CachePolicy
# - 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled, recommended for API Gateway
# - 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
# - b2884449-e4de-46a7-ac36-70bc7f1ddd6d # Managed-CachingOptimizedForUncompressedObjects
# - 08627262-05a9-4f76-9ded-b50ca2e3a84f # Managed-Elemental-MediaPackage

# Type: AWS::CloudFront::OriginRequestPolicy
# - 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
# - 33f36d7e-f396-46d9-90e0-52428a34d9dc # Managed-AllViewerAndCloudFrontHeaders-2022-06
# - b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader, recommended for API Gateway
# - 59781a5b-3903-41f3-afcb-af62929ccde1 # Managed-CORS-CustomOrigin
# - 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin
# - 775133bc-15f2-49f9-abea-afb2e0bf67d2 # Managed-Elemental-MediaTailor-PersonalizedManifests
# - acba4595-bd28-49b8-b9fe-13317c0390fa # Managed-UserAgentRefererHeaders

  # DevCachePolicy:
  #   Type: AWS::CloudFront::CachePolicy
  #   Properties:
  #     CachePolicyConfig:
  #       Name: !Sub ${AWS::StackName}-DevCachePlcy-${GuidParameter}
  #       DefaultTTL: 1
  #       MaxTTL: 1
  #       MinTTL: 1
  #       ParametersInCacheKeyAndForwardedToOrigin: 
  #         CookiesConfig:
  #           CookieBehavior:  all
  #         QueryStringsConfig:
  #           QueryStringBehavior: all
  #         EnableAcceptEncodingBrotli: true
  #         EnableAcceptEncodingGzip: true
  #         HeadersConfig: 
  #           HeaderBehavior: whitelist 
  #           Headers:
  #           - Authorization 
  #           - Accept-Charset 
  #           - Origin
  #           - Access-Control-Request-Method 
  #           - Access-Control-Request-Headers 
  #           - Accept 
  #           - Referer 
  #           - Accept-Language 
  #           - Accept-Datetime

  WebSocketOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${SystemKey}-WSOrignReqPlcy
        Comment: "OriginRequestPolciy - Forward necessary headers for WebSocket connections"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Sec-WebSocket-Key
            - Sec-WebSocket-Version
            - Sec-WebSocket-Protocol
            - Sec-WebSocket-Extensions
            - Sec-WebSocket-Accept
            - Host
            - Origin
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all


Outputs:
  CachePolicyId:
    # Managed-CachingOptimized
    Value: !If [IsDev, !Ref CachingOptimizedDevPolicy, 658327ea-f89d-4fab-a63d-7e88639e58f6]

  CacheByHeaderPolicyId:
    Value: !If [IsDev, !Ref CacheByHeaderDevPolicy, !Ref CacheByHeaderProdPolicy]

  OriginRequestPolicyId:
    # Managed-AllViewerExceptHostHeader
    Value: b689b0a8-53d0-40ab-baf2-68738e2966ac 

  ApiOriginRequestPolicyId:
    # Managed-AllViewerExceptHostHeader
    Value: b689b0a8-53d0-40ab-baf2-68738e2966ac 

  ApiCachePolicyId:
    # Managed-CachingDisabled
    Value: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad 

  WebsocketOriginRequestPolicyId:
    Value: !Ref WebSocketOriginRequestPolicy

  RequestFunctionArn:
    Value: !GetAtt RequestFunction.FunctionARN

  ApiRequestFunctionArn:
    Value: !GetAtt RequestFunction.FunctionARN

  AuthConfigFunctionArn:
    Value: !GetAtt AuthConfigFunction.FunctionARN


