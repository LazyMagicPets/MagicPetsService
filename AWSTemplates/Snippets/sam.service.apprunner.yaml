  __AppRunnerServiceName__LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/${AWS::StackName}-__AppRunnerServiceName__"
      RetentionInDays: 1

  __AppRunnerServiceName__:
    # Generated by __ResourceGenerator__ from __TemplateSource__
    Type: AWS::AppRunner::Service
    DependsOn: __AppRunnerServiceName__LogGroup
    Properties:
      ServiceName: !Sub "${AWS::StackName}-__AppRunnerServiceName__"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt __AppRunnerServiceName__AccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "__ImageUri__"
          ImageConfiguration:
            Port: __Port__
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: !Ref EnvironmentParameter
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS__Cognito__UserPoolId
                Value: !Ref __CognitoResource__UserPoolIdParameter
              - Name: AWS__AppSync__EventApiId
                Value: !Ref __AppSyncEventsApiName__
          ImageRepositoryType: ECR
        AutoDeploymentsEnabled: true
      InstanceConfiguration:
        Cpu: __Cpu__
        Memory: __Memory__
        InstanceRoleArn: !GetAtt __AppRunnerServiceName__InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 3
      AutoScalingConfigurationArn: !Ref __AppRunnerServiceName__AutoScalingConfiguration
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT

  __AppRunnerServiceName__AutoScalingConfiguration:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AWS::StackName}-__AppRunnerServiceName__-AS"
      MaxConcurrency: 150  # This represents the max requests for this architecture
      MaxSize: 1
      MinSize: 1

  # ECR repository is created by Deploy-DockerAws command before stack deployment
  # This ensures the image exists before App Runner tries to pull it

  __AppRunnerServiceName__InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-__AppRunnerServiceName__-InstanceRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
__ManagedPolicyArns__

  __AppRunnerServiceName__AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-__AppRunnerServiceName__-AccessRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
