  __AppSyncEventsApiName__:
    # Generated by __ResourceGenerator__ from __TemplateSource__
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "${AWS::StackName}-__AppSyncEventsApiName__"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: API_KEY
#CognitoAuth#
        ConnectionAuthModes:
          - AuthType: AWS_IAM
          - AuthType: API_KEY
#CognitoConnectionAuth#
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY
#CognitoSubscribeAuth#
        LogConfig:
          LogLevel: ALL
          CloudWatchLogsRoleArn: !GetAtt __AppSyncEventsApiName__LogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentParameter
        - Key: Service
          Value: __AppSyncEventsApiName__

  __AppSyncEventsApiName__LogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-__AppSyncEventsApiName__-LogRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/appsync/*"

  __AppSyncEventsApiName__PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-__AppSyncEventsApiName__-PublishRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncEventsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:EventPublish
                Resource: !Sub "${__AppSyncEventsApiName__}/*"

  __AppSyncEventsApiName__ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt __AppSyncEventsApiName__.ApiId
      Description: API Key for __AppSyncEventsApiName__
      Expires: !Ref AWS::NoValue  # No expiration

  __AppSyncEventsApiName__ChatChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt __AppSyncEventsApiName__.ApiId
      Name: chat
