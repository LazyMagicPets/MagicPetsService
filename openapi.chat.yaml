openapi: 3.0.1
paths:

  # Chat Management Endpoints
  '/chat/create':
    post:
      summary: Create new chat
      description: Creates a new chat and starts processing the initial message
      operationId: createChat
      x-lz-gencall: ChatRepo.CreateChatAsync(callerInfo, body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  '/chat/{chatId}/message':
    post:
      summary: Send message to existing chat
      description: Sends a message to an existing chat
      operationId: sendMessage
      x-lz-gencall: ChatRepo.SendMessageAsync(callerInfo, chatId, body)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  '/chat/{chatId}/status':
    get:
      summary: Get chat status
      description: Retrieves the current status and information about a chat
      operationId: getChatStatus
      x-lz-gencall: ChatRepo.GetChatStatusAsync(callerInfo, chatId)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
      responses:
        '200':
          description: Chat status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChatStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  '/chat/{chatId}':
    get:
      summary: Get chat by ID
      description: Retrieves a chat by its ID from persistent storage
      operationId: getChat
      x-lz-gencall: ChatRepo.GetChatAsync(callerInfo, chatId)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
      responses:
        '200':
          description: Chat retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChatResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    put:
      summary: Update chat
      description: Updates chat metadata and status in persistent storage
      operationId: updateChat
      x-lz-gencall: ChatRepo.UpdateChatAsync(callerInfo, chatId, body)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatRequest'
      responses:
        '200':
          description: Chat updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChatResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    delete:
      summary: Close chat
      description: Closes an active chat and cleans up resources
      operationId: closeChat
      x-lz-gencall: ChatRepo.CloseChatAsync(callerInfo, chatId)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat to close
      responses:
        '204':
          description: Chat closed successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  '/chat':
    get:
      summary: List chats
      description: Lists all chats for the authenticated user with pagination
      operationId: listChats
      x-lz-gencall: ChatRepo.ListChatsAsync(callerInfo, page, limit, status)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of chats per page
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChatStatus'
          description: Filter by chat status
      responses:
        '200':
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  # Health Check Endpoint (required by App Runner)
  '/health':
    get:
      summary: Health check endpoint
      description: Health check endpoint for App Runner service monitoring
      operationId: healthCheck
      x-lz-gencall: HealthService.CheckAsync(callerInfo)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnhealthyResponse'

  # Chat History Endpoints
  '/chat/{chatId}/messages':
    get:
      summary: Get chat message history
      description: Retrieves the message history for a chat
      operationId: getChatMessages
      x-lz-gencall: ChatRepo.GetChatMessagesAsync(callerInfo, chatId, page, limit)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of messages per page
      responses:
        '200':
          description: Message history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
