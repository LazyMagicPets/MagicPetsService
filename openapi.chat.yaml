openapi: 3.0.1
paths:

  # Standard CRUD Endpoints for Chat
  '/chat':
    post:
      summary: Create new chat
      description: Creates a new chat session
      operationId: addChat
      x-lz-gencall: ChatRepo.CreateAsync(callerInfo, body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
      responses:
        '200':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    get:
      summary: List chats
      description: Lists all chats for the authenticated user
      operationId: listChats
      x-lz-gencall: ChatRepo.ListAsync(callerInfo)
      responses:
        '200':
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  '/chat/{chatId}':
    get:
      summary: Get chat by ID
      description: Retrieves a chat by its ID
      operationId: getChatById
      x-lz-gencall: ChatRepo.ReadAsync(callerInfo, chatId)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
      responses:
        '200':
          description: Chat retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    put:
      summary: Update chat
      description: Updates an existing chat
      operationId: updateChat
      x-lz-gencall: ChatRepo.UpdateAsync(callerInfo, body)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
      responses:
        '200':
          description: Chat updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    delete:
      summary: Delete chat
      description: Deletes a chat and cleans up resources
      operationId: deleteChat
      x-lz-gencall: ChatRepo.DeleteAsync(callerInfo, chatId)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat to delete
      responses:
        '200':
          description: Chat deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  # ChatMessages CRUD Endpoints
  '/chat/{chatId}/messages':
    post:
      summary: Send message to chat
      description: Sends a new message to an existing chat
      operationId: addChatMessage
      x-lz-gencall: ChatRepo.CreateMessageAsync(callerInfo, chatId, body)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

    get:
      summary: Get chat messages
      description: Retrieves message history for a chat
      operationId: getChatMessages
      x-lz-gencall: ChatRepo.ReadMessagesAsync(callerInfo, chatId, page, limit)
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of messages per page
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  # Health Check Endpoint
  '/health':
    get:
      summary: Health check endpoint
      description: Health check endpoint for service monitoring
      operationId: healthCheck
      x-lz-gencall: HealthService.CheckAsync(callerInfo)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnhealthyResponse'
