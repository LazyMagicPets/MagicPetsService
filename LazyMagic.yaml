LazyMagicDirectivesVersion: 2.0.0

Directives:
# Cross cutting directives

  # SCHEMAS Default
  SchemaDefault:
    Type: Schema
    IsDefault: true # this directive may be referenced by other Schema directives
    Artifacts:
      DotNetSchemaProject: # system DTOs classes
      DotNetRepoProject: # DynamoDB CRUDL methods for DTOs

  # MODULES Default 
  ModuleDefault:
    Type: Module
    IsDefault: true # this directive may be referenced by other Module directives
    Artifacts:
      DotNetControllerProject: # methods for each REST path operation (now also generates client interface)

  # CONTAINERS Default  
  AwsApiLambdaContainerDefault:
    Type: Container
    IsDefault: true # this directive may be referenced by other Container directives
    Artifacts:
      DotNetApiLambdaProject: # Lambda function that processes the HttpApi request
      AwsApiLambdaResource: # AWS SAM template resource for the Lambda function
        ManagedPolicyArns: 
        # You can further restict this using the Perms stack
        # if you want to restrict db access by lambda
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess

  # API Default
  ApiDefault:
    Type: Api
    IsDefault: true # this directive may be referenced by other Api directives
    Artifacts:
      AwsHttpApiResource: # AWS SAM template resource for the HttpApi
      DotNetHttpApiSDKProject: # Client SDK for the Api

  # APP RUNNER Container Default
  AppRunnerContainerDefault:
    Type: Container
    IsDefault: true
    Artifacts:
      DotNetAppRunnerProject: # App Runner project that processes HTTP requests

  # API Default for App Runner (NOT using ApiDefault)
  ApiAppRunnerDefault:
    Type: Api
    IsDefault: true
    Artifacts:
      AwsAppRunnerResource: # AWS SAM template resource for App Runner service
      DotNetHttpApiSDKProject: # Reuse existing HTTP REST client SDK generator

  # API Default for AppSync Events (NOT using ApiDefault)
  ApiAppSyncEventsDefault:
    Type: Api
    IsDefault: true
    Artifacts:
      AwsAppSyncEventsResource: # AppSync Events CloudFormation resource
      DotNetAppSyncEventsSDKProject: # WebSocket client SDK (different from HTTP REST)

  # WEBAPP Default
  WebAppDefault:
    Type: WebApp # this directive may be referenced by other WebApp directives
    IsDefault: true

  # TENANCY Default
  TenancyDefaults:
    Type: Tenancy
    IsDefault: true # this directive may be referenced by other Tenancy directives
    Service: Service

  # AUTHENTICATORS - Authentication services
  tenantauth:
    Type: Authentication
    Artifacts:
      AwsCognitoResource: 
        Template: Templates/sam.cognito.tenant.yaml

  consumerauth:
    Type: Authentication
    Artifacts:
      AwsCognitoResource:
        Template: Templates/sam.cognito.consumer.yaml

# Application Directives

  ConsumerSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.consumer-schema.yaml

  SharedSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.shared-schema.yaml

  StoreSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.store-schema.yaml

  AdminSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.admin-schema.yaml

  PublicSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.public-schema.yaml

  # MODULES - libraries handling paths
 
  AdminModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.admin.yaml

  StoreModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.store.yaml

  ConsumerModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.consumer.yaml

  PublicModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.public.yaml

  # CONTAINERS - executables
 
  AdminLambda:
    Type: Container
    Defaults: AwsApiLambdaContainerDefault
    Modules:
    - PublicModule
    - ConsumerModule    
    - StoreModule
    - AdminModule
    Artifacts:
      AwsApiLambdaResource: # AWS SAM template resource for the Lambda function
        ManagedPolicyArns:
        # You can further restict permissions using the Perms stack but 
        # generally the admin module has full access to most services.
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
        - arn:aws:iam::aws:policy/CloudFrontFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  StoreLambda:
    Type: Container
    Defaults: AwsApiLambdaContainerDefault
    Modules:
    - PublicModule
    - ConsumerModule    
    - StoreModule

  ConsumerLambda:
    Type: Container
    Defaults: AwsApiLambdaContainerDefault
    Modules:
    - PublicModule
    - ConsumerModule

  PublicLambda:
    Type: Container
    Defaults: AwsApiLambdaContainerDefault
    Modules:
    - PublicModule

  # APIS - API Gateways that proxy requests to containers
  AdminApi:
    Type: Api
    Defaults: ApiDefault
    Authentication: tenantauth
    Containers:
    - AdminLambda

  StoreApi:
    Type: Api
    Defaults: ApiDefault
    Authentication: tenantauth
    Containers:
    - StoreLambda

  ConsumerApi:
    Type: Api
    Defaults: ApiDefault
    Authentication: consumerauth
    Containers:
    - ConsumerLambda

  PublicApi:
    Type: Api
    Defaults: ApiDefault
    Containers:
    - PublicLambda

  # Service
  Service:
    Type: Service
    Apis: # remember that each Api has it's own ClientSDK
    - AdminApi
    - StoreApi
    - ConsumerApi
    - PublicApi
    Artifacts:
      AwsServiceStackTemplate:

  LocalWebService:
    Type: Service
    Apis:
    - AdminApi
    - StoreApi
    - ConsumerApi
    - PublicApi
    Artifacts:
      DotNetLocalWebApiProject:

# DEPLOYMENT 
  Deployment:
    Type: Deployment
    Artifacts:
      AwsDeploymentConfig:

# WEBAPPS
  AdminApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: admin
    Apis:
    - AdminApi

  StoreApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: store 
    Apis:
    - StoreApi

  ConsumerApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: app
    Apis:
    - ConsumerApi

# TENANCIES
  Tenancy:
    Type: Tenancy
    Defaults: TenancyDefaults
    WebApps:
    - AdminApp
    - StoreApp
    - ConsumerApp

# APP RUNNER / CHAT IMPLEMENTATION (Phase 0 Test)

  # Chat Schema (for testing)
  ChatSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.chat-schema.yaml

  # Chat Module (for testing)
  ChatModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.chat.yaml

  # App Runner container using new artifacts
  ChatAppRunner:
    Type: Container
    Defaults: AppRunnerContainerDefault
    Modules:
    - ChatModule

  # API for App Runner service (uses ApiAppRunnerDefault, not ApiDefault)
  ChatApi:
    Type: Api
    Defaults: ApiAppRunnerDefault
    Authentication: tenantauth
    Containers:
    - ChatAppRunner

  # API for AppSync Events (needs separate default for different SDK)
  EventsApi:
    Type: Api
    Defaults: ApiAppSyncEventsDefault
    Authentication: tenantauth

