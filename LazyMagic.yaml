LazyMagicDirectivesVersion: 2.0.0

Directives:
# Cross cutting directives

  # SCHEMAS Default
  SchemaDefault:
    Type: Schema
    IsDefault: true # this directive may be referenced by other Schema directives
    Artifacts:
      DotNetSchemaProject: # system DTOs classes
      DotNetRepoProject: # DynamoDB CRUDL methods for DTOs

  # MODULES Default 
  ModuleDefault:
    Type: Module
    IsDefault: true # this directive may be referenced by other Module directives
    Artifacts:
      DotNetControllerProject: # methods for each REST path operation (now also generates client interface)

  # APP RUNNER Container Default
  AppRunnerContainerDefault:
    Type: Container
    IsDefault: true
    Artifacts:
      AspDotNetProject: # Simple ASP.NET Core Web API project

  # API Default for App Runner
  ApiAppRunnerDefault:
    Type: Api
    IsDefault: true
    Artifacts:
      AspDotNetApiSDKProject:
      AwsApiAppRunnerResource: # App Runner CloudFormation resource
        
  # API Default for AppSync Events (NOT using ApiDefault)
  ApiAppSyncEventsDefault:
    Type: Api
    IsDefault: true
    Artifacts:
      AwsAppSyncEventsResource: # AppSync Events CloudFormation resource

  # WEBAPP Default
  WebAppDefault:
    Type: WebApp # this directive may be referenced by other WebApp directives
    IsDefault: true

  # TENANCY Default
  TenancyDefaults:
    Type: Tenancy
    IsDefault: true # this directive may be referenced by other Tenancy directives
    Service: Service

  # AUTHENTICATORS - Authentication services
  tenantauth: #must be lowercase due to CF template limitations
    Type: Authentication
    Artifacts:
      AwsCognitoResource: 
        Template: Templates/sam.cognito.tenant.yaml

  consumerauth: # must be lowercase due to CF template limitations
    Type: Authentication
    Artifacts:
      AwsCognitoResource:
        Template: Templates/sam.cognito.consumer.yaml

# Application Directives

  ConsumerSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.consumer-schema.yaml

  SharedSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.shared-schema.yaml

  StoreSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.store-schema.yaml

  AdminSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.admin-schema.yaml

  PublicSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.public-schema.yaml

  ChatSchema:
    Type: Schema
    Defaults: SchemaDefault
    OpenApiSpecs:
    - openapi.chat-schema.yaml

  # MODULES - libraries handling paths
 
  AdminModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.admin.yaml

  StoreModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.store.yaml

  ConsumerModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.consumer.yaml

  PublicModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.public.yaml

  ChatModule:
    Type: Module
    Defaults: ModuleDefault
    OpenApiSpecs:
    - openapi.chat.yaml

  # CONTAINERS - executables

  # Due to limintations in the AWS CF Templates, keep the name of containers <= 12 characters
  StoreHost: # Asp.Net Core host running in App Runner for Admin and Store apps
    Type: Container
    Defaults: AppRunnerContainerDefault
    Modules:
    - ChatModule
    - PublicModule
    - ConsumerModule    
    - StoreModule
    - AdminModule
    Artifacts:
      AwsAppRunnerResource:
        EventsApi: StoreEventsApi # allows StoreContainer to publish events
        Authentication: tenantauth # this container does its own authentication
        ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonCognitoPowerUser
        - arn:aws:iam::aws:policy/CloudFrontFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  # Due to limintations in the AWS CF Templates, keep the name of containers <= 12 characters
  ConsumerHost: # Asp.Net Core host running in App Runner for Public and Consumer apps
    Type: Container
    Defaults: AppRunnerContainerDefault
    Modules:
    - ChatModule
    - PublicModule
    - ConsumerModule    
    Artifacts:
      AwsAppRunnerResource:
        EventsApi: ConsumerEventsApi # allows ConsumerContainer to publish events
        Authentication: consumerauth # this container does its own authentication
        ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  # APIS 

  StoreApi: # Direct Asp.Net Core host running in App Runner
    Type: Api
    Defaults: ApiAppRunnerDefault
    Containers:
    - StoreHost

  ConsumerApi: # Direct Asp.Net Core host running in App Runner
    Type: Api
    Defaults: ApiAppRunnerDefault
    Containers:
    - ConsumerHost
  
  StoreEventsApi:
    Type: Api
    Defaults: ApiAppSyncEventsDefault
    Authentication: tenantauth

  ConsumerEventsApi:
    Type: Api
    Defaults: ApiAppSyncEventsDefault
    Authentication: consumerauth

  # Service
  Service:
    Type: Service
    Apis:
    - StoreApi
    - ConsumerApi 
    - StoreEventsApi
    - ConsumerEventsApi
    Artifacts:
      AwsServiceStackTemplate:

  LocalWebService:
    Type: Service
    Apis:
    - StoreApi
    Artifacts:
      DotNetLocalWebApiProject:

# DEPLOYMENT 
  Deployment:
    Type: Deployment
    Artifacts:
      AwsDeploymentConfig:

# WEBAPPS
  AdminApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: admin
    Apis:
    - StoreApi

  StoreApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: store 
    Apis:
    - StoreApi

  ConsumerApp:
    Type: WebApp
    Defaults: WebAppDefault
    Path: app
    Apis:
    - ConsumerApi

# TENANCIES
  Tenancy:
    Type: Tenancy
    Defaults: TenancyDefaults
    WebApps:
    - AdminApp
    - StoreApp
    - ConsumerApp







