openapi: 3.0.1
paths:
  /ChatModule/chat:
    post:
      summary: Create new chat
      description: Creates a new chat session
      operationId: ChatModuleAddChatAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      responses:
        200:
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatRepo.CreateAsync(callerInfo, body)
    get:
      summary: List chats
      description: Lists all chats for the authenticated user
      operationId: ChatModuleListChatsAsync
      responses:
        200:
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatRepo.ListAsync(callerInfo)
  /ChatModule/health:
    get:
      summary: Health check endpoint
      description: Health check endpoint for service monitoring
      operationId: ChatModuleHealthCheckAsync
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        503:
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnhealthyResponse'
      x-lz-gencall: HealthService.CheckAsync(callerInfo)
  '/ChatModule/chat/{chatId}':
    get:
      summary: Get chat by ID
      description: Retrieves a chat by its ID
      operationId: ChatModuleGetChatByIdAsync
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID of the chat
        schema:
          type: string
      responses:
        200:
          description: Chat retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        404:
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatRepo.ReadAsync(callerInfo, chatId)
    put:
      summary: Update chat
      description: Updates an existing chat
      operationId: ChatModuleUpdateChatAsync
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID of the chat to update
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chat'
        required: true
      responses:
        200:
          description: Chat updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        404:
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatRepo.UpdateAsync(callerInfo, body)
    delete:
      summary: Delete chat
      description: Deletes a chat and cleans up resources
      operationId: ChatModuleDeleteChatAsync
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID of the chat to delete
        schema:
          type: string
      responses:
        200:
          description: Chat deleted successfully
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        404:
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatRepo.DeleteAsync(callerInfo, chatId)
  '/ChatModule/chat/{chatId}/messages':
    post:
      summary: Send message to chat
      description: Sends a new message to an existing chat
      operationId: ChatModuleAddChatMessageAsync
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID of the chat
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
        required: true
      responses:
        200:
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        404:
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatMessagesRepo.AddMessageAsync(callerInfo, chatId, body)
    get:
      summary: Get chat messages
      description: Retrieves message history for a chat
      operationId: ChatModuleGetChatMessagesAsync
      parameters:
      - name: chatId
        in: path
        required: true
        description: ID of the chat
        schema:
          type: string
      - name: page
        in: query
        description: Page number for pagination
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        description: Number of messages per page
        schema:
          type: integer
          maximum: 100
          minimum: 1
      responses:
        200:
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        404:
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-lz-gencall: ChatMessagesRepo.GetMessagesAsync(callerInfo, chatId, page, limit)
components:
  schemas:
    Preferences:
      type: object
      properties:
        id:
          type: string
        theme:
          type: string
          enum:
          - light
          - dark
        locale:
          type: string
          enum:
          - en
          - fr
          - es
        petStatus:
          description: pet status in the store
          $ref: '#/components/schemas/PetStatus'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        pet:
          $ref: '#/components/schemas/Pet'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Pet:
      type: object
      required:
      - name
      - photoUrls
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
          example: Dog
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        petStatus:
          description: pet status in the store
          default: available
          $ref: '#/components/schemas/PetStatus'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    PetStatus:
      type: string
      description: pet status in the store
      enum:
      - available
      - pending
      - sold
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          description: Cognito Identity Id of clerk entering order
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        orderStatus:
          title: orderStatus
          description: Order Status
          $ref: '#/components/schemas/OrderStatus'
        complete:
          type: boolean
          default: false
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    OrderStatus:
      type: string
      description: Order Status
      enum:
      - placed
      - approved
      - delivered
    Subtenant:
      type: object
      x-csharp-type: TenancyConfig
    TenantUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        employee:
          type: boolean
        admin:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    TenantUserStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      x-lz-genrepo: true
    Bada:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Fingerprint:
      type: object
      properties:
        id:
          type: string
        fingerprint:
          type: number
        browser:
          type: string
        browserVersion:
          type: string
        os:
          type: string
        osVersion:
          type: string
        resolution:
          type: string
        userAgent:
          type: string
        device:
          type: string
        deviceType:
          type: string
        deviceVendor:
          type: string
        language:
          type: string
        timeZone:
          type: string
        screenPrint:
          type: string
        isMobile:
          type: boolean
        isChrome:
          type: boolean
        isFirefox:
          type: boolean
        isSafari:
          type: boolean
        isIE:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Chat:
      type: object
      required:
      - chatId
      - status
      - createdAt
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatId)
        chatId:
          type: string
          description: Unique identifier for the chat
        userId:
          type: string
          description: User ID from Cognito authentication
        status:
          $ref: '#/components/schemas/ChatStatus'
        summary:
          type: string
          description: Brief summary of the chat conversation
        chatMessagesId:
          type: string
          description: Reference to the ChatMessages record containing all messages
        messageCount:
          type: integer
          description: Total number of messages in the chat
        createdAt:
          type: string
          description: When the chat was created
          format: date-time
        lastActivityAt:
          type: string
          description: Last activity timestamp
          format: date-time
        metadata:
          type: object
          description: Additional chat metadata
        createUtcTick:
          type: integer
          description: Creation timestamp in ticks
          format: int64
        updateUtcTick:
          type: integer
          description: Last update timestamp in ticks
          format: int64
      x-lz-genrepo: true
    ChatStatus:
      type: string
      description: Current status of the chat
      enum:
      - active
      - processing
      - completed
      - error
      - closed
    ChatMessage:
      type: object
      required:
      - messageId
      - chatId
      - role
      - content
      - timestamp
      properties:
        messageId:
          type: string
          description: Unique identifier for the message
        chatId:
          type: string
          description: Chat this message belongs to
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: Message content
        timestamp:
          type: string
          description: When the message was created
          format: date-time
        metadata:
          type: object
          description: Additional message metadata
    ChatMessages:
      type: object
      required:
      - chatMessagesId
      - chatId
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatMessagesId)
        chatMessagesId:
          type: string
          description: Unique identifier for the messages collection
        chatId:
          type: string
          description: Reference to the parent chat
        messages:
          type: array
          description: Array of all messages in the chat
          items:
            $ref: '#/components/schemas/ChatMessage'
        createUtcTick:
          type: integer
          description: Creation timestamp in ticks
          format: int64
        updateUtcTick:
          type: integer
          description: Last update timestamp in ticks
          format: int64
      x-lz-genrepo: true
    ChatMessageRole:
      type: string
      description: Role of the message sender
      enum:
      - user
      - assistant
      - system
    ChatEvent:
      type: object
      required:
      - eventType
      - chatId
      - timestamp
      properties:
        eventType:
          $ref: '#/components/schemas/ChatEventType'
        chatId:
          type: string
          description: Chat this event relates to
        timestamp:
          type: string
          description: When the event occurred
          format: date-time
        data:
          type: object
          description: Event-specific data
    ChatEventType:
      type: string
      description: Type of chat event
      enum:
      - chat_created
      - chat_status_changed
      - message_received
      - message_processing
      - message_completed
      - chat_closed
      - error_occurred
    MessageEvent:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    StatusChangeEvent:
      type: object
      properties:
        oldStatus:
          $ref: '#/components/schemas/ChatStatus'
        newStatus:
          $ref: '#/components/schemas/ChatStatus'
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    ErrorEvent:
      type: object
      properties:
        error:
          type: string
          description: Error message
        errorCode:
          type: string
          description: Error code for client handling
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    ChatError:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message
        chatId:
          type: string
          description: Chat ID if error is chat-related
        timestamp:
          type: string
          description: When the error occurred
          format: date-time
    HealthCheckResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          description: Service version
    HealthStatus:
      type: string
      enum:
      - healthy
      - unhealthy
    UnhealthyResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        error:
          type: string
          description: Error description
...
