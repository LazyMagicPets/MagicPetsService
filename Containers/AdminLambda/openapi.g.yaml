openapi: 3.0.1
paths:
  /PublicModule/fingerprint/create:
    post:
      operationId: PublicModuleFingerprintCreateAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fingerprint'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fingerprint'
        403:
          description: Invalid permissions
        405:
          description: Invalid data
      x-lz-gencall: FingerprintRepo.CreateAsync(callerInfo, body)
  /PublicModule/pet/listPets:
    get:
      summary: List all pets
      operationId: PublicModuleListPetsAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        400:
          description: Invalid status value
      x-lz-gencall: PetRepo.ListAsync(callerInfo)
  /PublicModule/pet/findByStatus:
    get:
      summary: Finds Pets by status
      description: Multiple status values can be provided with comma separated strings
      operationId: PublicModuleFindPetsByStatusAsync
      parameters:
      - name: petStatus
        in: query
        explode: true
        required: true
        description: Status values that need to be considered for filter
        schema:
          type: array
          default: available
          items:
            $ref: '#/components/schemas/PetStatus'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        400:
          description: Invalid status value
  /PublicModule/pet/findByTags:
    get:
      summary: Finds Pets by tags
      description: Muliple tags can be provided with comma separated strings. Use\ \ tag1, tag2, tag3 for testing.
      operationId: PublicModuleFindPetsByTagsAsync
      parameters:
      - name: tags
        in: query
        explode: true
        required: true
        description: Tags to filter by
        schema:
          type: array
          items:
            type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        400:
          description: Invalid tag value
  /PublicModule/pet/categories:
    get:
      summary: Get all Pet Categories
      operationId: PublicModuleGetPetCategoriesAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      x-lz-gencall: CategoryRepo.ListAsync(callerInfo)
  /PublicModule/pet/tags:
    get:
      summary: Get all Pet Tags
      operationId: PublicModuleGetPetTagsAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
      x-lz-gencall: TagRepo.ListAsync(callerInfo)
  /ConsumerModule/preferences:
    get:
      summary: Get user preferences
      operationId: ConsumerModuleGetPreferencesAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
      x-lz-gencall: PreferencesRepo.ReadAsync(callerInfo, callerInfo.LzUserId)
    post:
      summary: Update user preferences
      operationId: ConsumerModuleUpdatePreferencesAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
      x-lz-gencall: PreferencesRepo.UpdateAsync(callerInfo, body)
  /StoreModule/pet/listPets:
    get:
      summary: List all pets
      operationId: StoreModuleListPetsAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        400:
          description: Invalid status value
      x-lz-gencall: PetRepo.ListAsync(callerInfo)
  /StoreModule/pet:
    post:
      summary: Add a new pet to the store
      operationId: StoreModuleAddPetAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        405:
          description: Invalid input
      x-lz-gencall: PetRepo.CreateAsync(callerInfo, body)
    put:
      summary: Update an existing pet
      operationId: StoreModuleUpdatePetAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        400:
          description: Invalid ID supplied
        404:
          description: Pet not found
        405:
          description: Validation exception
      x-lz-gencall: PetRepo.UpdateAsync(callerInfo, body)
  /StoreModule/order/inventory:
    get:
      summary: Returns pet inventories by status
      description: Returns a map of status codes to quantities
      operationId: StoreModuleGetInventoryAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /StoreModule/order:
    post:
      summary: Place an order for a pet
      operationId: StoreModulePlaceOrderAsync
      requestBody:
        description: order placed for purchasing the pet
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid Order
      x-lz-gencall: OrderRepo.CreateAsync(callerInfo, body)
  /AdminModule/isAdmin:
    get:
      summary: Check if currently logged in tenantUser is an admin
      operationId: AdminModuleIsAdminAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUserStatus'
  /AdminModule/tenantUser:
    post:
      summary: Add a new tenantUser
      operationId: AdminModuleAddTenantUserAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        405:
          description: Invalid input
      x-lz-gencall: TenantUserRepo.CreateAsync(callerInfo, body)
    put:
      summary: Update an existing tenantUser
      operationId: AdminModuleUpdateTenantUserAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUser'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
        405:
          description: Validation exception
      x-lz-gencall: TenantUserRepo.UpdateAsync(callerInfo, body)
  /AdminModule/tenantUser/listTenantUsers:
    get:
      summary: List all tenantUsers
      operationId: AdminModuleListTenantUsersAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid status value
      x-lz-gencall: TenantUserRepo.ListAsync(callerInfo)
  /AdminModule/subtenant:
    post:
      summary: Add a new Subtenant
      operationId: AdminModuleAddSubtenantAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        405:
          description: Invalid input
    put:
      summary: Update an existing Subtenant
      operationId: AdminModuleUpdateSubtenantAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subtenant'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
        405:
          description: Validation exception
  /AdminModule/subtenant/listSubtenants:
    get:
      summary: List all Subtenants
      operationId: AdminModuleListSubtenantsAsync
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid status value
  '/PublicModule/pet/{petId}':
    get:
      summary: Find pet by ID
      description: Returns a single pet
      operationId: PublicModuleGetPetByIdAsync
      parameters:
      - name: petId
        in: path
        required: true
        description: ID of pet to return
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        400:
          description: Invalid ID supplied
        404:
          description: Pet not found
      x-lz-gencall: PetRepo.ReadAsync(callerInfo, petId)
  '/StoreModule/pet/{petId}':
    delete:
      summary: Deletes a pet
      operationId: StoreModuleDeletePetAsync
      parameters:
      - name: petId
        in: path
        required: true
        description: Pet id to delete
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: Pet not found
      x-lz-gencall: PetRepo.DeleteAsync(callerInfo, petId)
  '/StoreModule/order/{orderId}':
    get:
      summary: Find purchase order by ID
      description: For valid response try integer IDs with value >= 1 and <= 10.\ \ Other values will generated exceptions
      operationId: StoreModuleGetOrderByIdAsync
      parameters:
      - name: orderId
        in: path
        required: true
        description: ID of pet that needs to be fetched
        schema:
          type: string
          maximum: 10
          minimum: 1
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid ID supplied
        404:
          description: Order not found
      x-lz-gencall: OrderRepo.ReadAsync(callerInfo, orderId)
    delete:
      summary: Delete purchase order by ID
      operationId: StoreModuleDeleteOrderAsync
      parameters:
      - name: orderId
        in: path
        required: true
        description: ID of the order that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: Order not found
      x-lz-gencall: OrderRepo.DeleteAsync(callerInfo, orderId)
  '/AdminModule/subtenant/seedPets/{store}/{numPets}':
    get:
      summary: See pet database
      operationId: AdminModuleSeedPetsAsync
      parameters:
      - name: store
        in: path
        required: true
        description: Store to seed
        schema:
          type: string
      - name: numPets
        in: path
        required: true
        description: Number of pets to seed
        schema:
          type: integer
        default: 10
      responses:
        200:
          description: Success
  '/AdminModule/suspendTenantUser/{tenantUser}':
    get:
      summary: Suspend TenantUser
      operationId: AdminModuleSuspendTenantUserAsync
      parameters:
      - name: tenantUser
        in: path
        required: true
        description: tenantUser login
        schema:
          type: string
      responses:
        200:
          description: Success
  '/AdminModule/tenantUser/{tenantUserId}':
    get:
      summary: Find tenantUser by ID
      operationId: AdminModuleGetTenantUserByIdAsync
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.ReadAsync(callerInfo, tenantUserId)
  '/AdminModule/tenantUser/delete/{tenantUserId}':
    delete:
      summary: Delete tenantUser by ID
      operationId: AdminModuleDeleteTenantUserAsync
      parameters:
      - name: tenantUserId
        in: path
        required: true
        description: ID of tenantUser that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: TenantUser not found
      x-lz-gencall: TenantUserRepo.DeleteAsync(callerInfo, tenantUserId)
  '/AdminModule/subtenant/{subtenantId}':
    get:
      summary: Find Subtenant by ID
      operationId: AdminModuleGetSubtenantByIdAsync
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be fetched
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subtenant'
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
  '/AdminModule/subtenant/delete/{subtenantId}':
    delete:
      summary: Delete Subtenant by ID
      operationId: AdminModuleDeleteSubtenantAsync
      parameters:
      - name: SubtenantId
        in: path
        required: true
        description: ID of Subtenant that needs to be deleted
        schema:
          type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID supplied
        404:
          description: Subtenant not found
components:
  schemas:
    Preferences:
      type: object
      properties:
        id:
          type: string
        theme:
          type: string
          enum:
          - light
          - dark
        locale:
          type: string
          enum:
          - en
          - fr
          - es
        petStatus:
          description: pet status in the store
          $ref: '#/components/schemas/PetStatus'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        pet:
          $ref: '#/components/schemas/Pet'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Pet:
      type: object
      required:
      - name
      - photoUrls
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
          example: Dog
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        petStatus:
          description: pet status in the store
          default: available
          $ref: '#/components/schemas/PetStatus'
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    PetStatus:
      type: string
      description: pet status in the store
      enum:
      - available
      - pending
      - sold
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          description: Cognito Identity Id of clerk entering order
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        orderStatus:
          title: orderStatus
          description: Order Status
          $ref: '#/components/schemas/OrderStatus'
        complete:
          type: boolean
          default: false
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    OrderStatus:
      type: string
      description: Order Status
      enum:
      - placed
      - approved
      - delivered
    Subtenant:
      type: object
      x-csharp-type: TenancyConfig
    TenantUser:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        employee:
          type: boolean
        admin:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
      x-lz-genrepo: true
    TenantUserStatus:
      type: object
      properties:
        isAdmin:
          type: boolean
      x-lz-genrepo: true
    Bada:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      x-lz-genrepo: true
    Fingerprint:
      type: object
      properties:
        id:
          type: string
        fingerprint:
          type: number
        browser:
          type: string
        browserVersion:
          type: string
        os:
          type: string
        osVersion:
          type: string
        resolution:
          type: string
        userAgent:
          type: string
        device:
          type: string
        deviceType:
          type: string
        deviceVendor:
          type: string
        language:
          type: string
        timeZone:
          type: string
        screenPrint:
          type: string
        isMobile:
          type: boolean
        isChrome:
          type: boolean
        isFirefox:
          type: boolean
        isSafari:
          type: boolean
        isIE:
          type: boolean
        createUtcTick:
          type: integer
          format: int64
        updateUtcTick:
          type: integer
          format: int64
    Chat:
      type: object
      required:
      - chatId
      - status
      - createdAt
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatId)
        chatId:
          type: string
          description: Unique identifier for the chat
        userId:
          type: string
          description: User ID from Cognito authentication
        status:
          $ref: '#/components/schemas/ChatStatus'
        summary:
          type: string
          description: Brief summary of the chat conversation
        messageCount:
          type: integer
          description: Total number of messages in the chat
        createdAt:
          type: string
          description: When the chat was created
          format: date-time
        lastActivityAt:
          type: string
          description: Last activity timestamp
          format: date-time
        metadata:
          type: object
          description: Additional chat metadata
        createUtcTick:
          type: integer
          description: Creation timestamp in ticks
          format: int64
        updateUtcTick:
          type: integer
          description: Last update timestamp in ticks
          format: int64
      x-lz-genrepo: true
    ChatStatus:
      type: string
      description: Current status of the chat
      enum:
      - active
      - processing
      - completed
      - error
      - closed
    ChatMessage:
      type: object
      required:
      - messageId
      - chatId
      - role
      - content
      - timestamp
      properties:
        messageId:
          type: string
          description: Unique identifier for the message
        chatId:
          type: string
          description: Chat this message belongs to
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: Message content
        timestamp:
          type: string
          description: When the message was created
          format: date-time
        metadata:
          type: object
          description: Additional message metadata
    ChatMessages:
      type: object
      required:
      - chatId
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatId)
        chatId:
          type: string
          description: Reference to the parent chat (also used as primary key)
        messages:
          type: array
          description: Array of all messages in the chat
          items:
            $ref: '#/components/schemas/ChatMessage'
        createUtcTick:
          type: integer
          description: Creation timestamp in ticks
          format: int64
        updateUtcTick:
          type: integer
          description: Last update timestamp in ticks
          format: int64
      x-lz-genrepo: true
    ChatMessageRole:
      type: string
      description: Role of the message sender
      enum:
      - user
      - assistant
      - system
    ChatEvent:
      type: object
      required:
      - eventType
      - chatId
      - timestamp
      properties:
        eventType:
          $ref: '#/components/schemas/ChatEventType'
        chatId:
          type: string
          description: Chat this event relates to
        timestamp:
          type: string
          description: When the event occurred
          format: date-time
        data:
          type: object
          description: Event-specific data
    ChatEventType:
      type: string
      description: Type of chat event
      enum:
      - chat_created
      - chat_status_changed
      - message_received
      - message_processing
      - message_streaming
      - message_completed
      - chat_closed
      - error_occurred
    MessageEvent:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    StatusChangeEvent:
      type: object
      properties:
        oldStatus:
          $ref: '#/components/schemas/ChatStatus'
        newStatus:
          $ref: '#/components/schemas/ChatStatus'
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    ErrorEvent:
      type: object
      properties:
        error:
          type: string
          description: Error message
        errorCode:
          type: string
          description: Error code for client handling
      allOf:
      - $ref: '#/components/schemas/ChatEvent'
    ChatError:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message
        chatId:
          type: string
          description: Chat ID if error is chat-related
        timestamp:
          type: string
          description: When the error occurred
          format: date-time
    HealthCheckResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          description: Service version
    HealthStatus:
      type: string
      enum:
      - healthy
      - unhealthy
    UnhealthyResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        error:
          type: string
          description: Error description
...
