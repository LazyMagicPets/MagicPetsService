openapi: 3.0.1
components:
  schemas:

    # Chat Management Schemas
    Chat:
      type: object
      x-lz-genrepo: true
      required:
        - chatId
        - status
        - createdAt
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatId)
        chatId:
          type: string
          description: Unique identifier for the chat
        userId:
          type: string
          description: User ID from Cognito authentication
        status:
          $ref: '#/components/schemas/ChatStatus'
        summary:
          type: string
          description: Brief summary of the chat conversation
        chatMessagesId:
          type: string
          description: Reference to the ChatMessages record containing all messages
        messageCount:
          type: integer
          description: Total number of messages in the chat
        createdAt:
          type: string
          format: date-time
          description: When the chat was created
        lastActivityAt:
          type: string
          format: date-time
          description: Last activity timestamp
        metadata:
          type: object
          additionalProperties: true
          description: Additional chat metadata
        createUtcTick:
          type: integer
          format: int64
          description: Creation timestamp in ticks
        updateUtcTick:
          type: integer
          format: int64
          description: Last update timestamp in ticks

    ChatStatus:
      type: string
      enum:
        - active
        - processing
        - completed
        - error
        - closed
      description: Current status of the chat

    # Message Schemas
    ChatMessage:
      type: object
      required:
        - messageId
        - chatId
        - role
        - content
        - timestamp
      properties:
        messageId:
          type: string
          description: Unique identifier for the message
        chatId:
          type: string
          description: Chat this message belongs to
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        content:
          type: string
          description: Message content
        timestamp:
          type: string
          format: date-time
          description: When the message was created
        metadata:
          type: object
          additionalProperties: true
          description: Additional message metadata

    ChatMessages:
      type: object
      x-lz-genrepo: true
      required:
        - chatMessagesId
        - chatId
      properties:
        id:
          type: string
          description: DynamoDB primary key (same as chatMessagesId)
        chatMessagesId:
          type: string
          description: Unique identifier for the messages collection
        chatId:
          type: string
          description: Reference to the parent chat
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Array of all messages in the chat
        createUtcTick:
          type: integer
          format: int64
          description: Creation timestamp in ticks
        updateUtcTick:
          type: integer
          format: int64
          description: Last update timestamp in ticks

    ChatMessageRole:
      type: string
      enum:
        - user
        - assistant
        - system
      description: Role of the message sender

    # Request/Response Schemas
    CreateChatRequest:
      type: object
      required:
        - initialMessage
      properties:
        initialMessage:
          type: string
          description: Initial message to start the conversation
        chatMetadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the chat

    CreateChatResponse:
      type: object
      required:
        - chat
      properties:
        chat:
          $ref: '#/components/schemas/Chat'

    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Message content to send
        messageMetadata:
          type: object
          additionalProperties: true
          description: Optional metadata for the message

    SendMessageResponse:
      type: object
      required:
        - message
        - chat
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        chat:
          $ref: '#/components/schemas/Chat'

    GetChatResponse:
      type: object
      required:
        - chat
      properties:
        chat:
          $ref: '#/components/schemas/Chat'

    UpdateChatRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ChatStatus'
        metadata:
          type: object
          additionalProperties: true
          description: Updated metadata for the chat

    UpdateChatResponse:
      type: object
      required:
        - chat
      properties:
        chat:
          $ref: '#/components/schemas/Chat'

    ListChatsResponse:
      type: object
      required:
        - chats
        - pagination
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
        pagination:
          $ref: '#/components/schemas/ChatPaginationInfo'

    ChatPaginationInfo:
      type: object
      required:
        - page
        - limit
        - totalChats
        - hasMore
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalChats:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    GetChatStatusResponse:
      type: object
      required:
        - chat
        - messageCount
      properties:
        chat:
          $ref: '#/components/schemas/Chat'
        messageCount:
          type: integer
          description: Total number of messages in the chat
        lastMessage:
          $ref: '#/components/schemas/ChatMessage'

    # Event Schemas for AppSync Events
    ChatEvent:
      type: object
      required:
        - eventType
        - chatId
        - timestamp
      properties:
        eventType:
          $ref: '#/components/schemas/ChatEventType'
        chatId:
          type: string
          description: Chat this event relates to
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        data:
          type: object
          additionalProperties: true
          description: Event-specific data

    ChatEventType:
      type: string
      enum:
        - chat_created
        - chat_status_changed
        - message_received
        - message_processing
        - message_completed
        - chat_closed
        - error_occurred
      description: Type of chat event

    MessageEvent:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChatEvent'
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'

    StatusChangeEvent:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChatEvent'
      properties:
        oldStatus:
          $ref: '#/components/schemas/ChatStatus'
        newStatus:
          $ref: '#/components/schemas/ChatStatus'

    ErrorEvent:
      type: object
      allOf:
        - $ref: '#/components/schemas/ChatEvent'
      properties:
        error:
          type: string
          description: Error message
        errorCode:
          type: string
          description: Error code for client handling

    # Error Response Schema
    ChatError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message
        chatId:
          type: string
          description: Chat ID if error is chat-related
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

    # Health Check Response Schemas
    HealthCheckResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          description: Service version

    HealthStatus:
      type: string
      enum:
        - healthy
        - unhealthy

    UnhealthyResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        timestamp:
          type: string
          format: date-time
        error:
          type: string
          description: Error description

    # Chat Messages Response Schema
    ChatMessagesResponse:
      type: object
      required:
        - messages
        - pagination
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    PaginationInfo:
      type: object
      required:
        - page
        - limit
        - totalMessages
        - hasMore
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalMessages:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
